<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Problema</title>
    <link rel="stylesheet" href="../css/reportar.css">
    <link rel="stylesheet" href="../css/navegador.css">
</head>

<body>
    <header>
        <a href="../html/dash-usu.html">
            <img src="../img/flecha-izquierda.png" alt="flecha izquierda" class="flecha-izquierda">
        </a>
        <h3>Reportar Problema</h3>
    </header>
    <form action="" id="form-reporte">
        <label>Aula:</label>
<input type="text" name="aula" id="aula" placeholder="Ej: Aula 201, Laboratorio 3" 
       maxlength="50" required>

        <label>Tipo de problema:</label>
<select name="tipo" id="id_tipo" required>
    <option value="">Cargando...</option>
</select>

        <label>Descripción del problema:</label>
        <textarea name="descripcion" id="descripcion" minlength="10" maxlength="500" required></textarea>

        <label>Adjuntar imagen (opcional):</label>
        <label for="imagen" class="upload-box" id="upload-box">
            <span class="upload-texto">📷 Toca para subir una imagen</span>
            <span class="upload-subtexto">JPG, PNG · máx 5 MB</span>
        </label>

        <input type="file" name="imagen" id="imagen" accept="image/*" hidden>

<img id="preview" src="" alt="Vista previa" style="display:none;">
        <button type="submit" class="btn-enviar">
    <img src="../img/enviar.png" alt="enviar" class="icono-enviar">
    Enviar Reporte
</button>

    </form>

    <footer>
  <a href="../html/dash-usu.html" class="btn-footer">
    <img class="icono-footer" src="../img/inicio.png" alt="Inicio">
    <p>Inicio</p>
  </a>

  <a href="../html/mis-reportes.html" class="btn-footer">
    <img class="icono-footer" src="../img/reportes.png" alt="Técnico">
    <p>Reportes</p>
  </a>

</footer>





    <script src="../js/mostrarimg.js"></script>
<script src="../js/reportar.js"></script>
</body>

</html>
