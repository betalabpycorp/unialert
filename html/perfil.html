<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Perfil</title>


    <link
        rel="stylesheet"
        href="../css/perfil.css"
    >

    <link
        rel="stylesheet"
        href="../css/navegador.css"
    >

    <link
        rel="stylesheet"
        href="../css/reportar.css"
    >

</head>



<body>


    <!-- HEADER -->

    <header>

        <a href="#" id="volver-inicio">

            <img
                src="../img/flecha-izquierda.png"
                alt="Volver"
                class="flecha-izquierda"
            >

        </a>


        <h3>
            Mi Perfil
        </h3>

    </header>





    <!-- INFORMACIÓN DEL PERFIL -->

    <section class="perfil-info">


        <div class="perfil-avatar">

            <img
                class="perfil-foto"
                src="../img/usuario.png"
                alt="Foto de perfil"
            >

        </div>


        <h2 id="nombre-perfil">
            Cargando...
        </h2>


        <p id="correo-perfil">
            Cargando...
        </p>


    </section>





    <!-- OPCIONES -->

    <section class="perfil-opciones">


        <a href="#" class="perfil-item">

            <img
                class="perfil-icono"
                src="../img/config.png"
                alt=""
            >

            <p>
                Editar perfil
            </p>


            <span class="perfil-flecha">
                ›
            </span>


        </a>





        <a
            href="../html/mis-reportes.html"
            class="perfil-item"
        >

            <img
                class="perfil-icono"
                src="../img/reportes.png"
                alt=""
            >


            <p>
                Mis reportes
            </p>


            <span class="perfil-flecha">
                ›
            </span>


        </a>





        <a href="#" class="perfil-item">


            <img
                class="perfil-icono"
                src="../img/ayuda.png"
                alt=""
            >


            <p>
                Ayuda y soporte
            </p>


            <span class="perfil-flecha">
                ›
            </span>


        </a>





        <a
            href="../php/cerrar-sesion.php"
            class="perfil-item cerrar"
        >

            <p>
                Cerrar sesión
            </p>


        </a>



    </section>







    <!-- FOOTER -->

    <footer>


        <a
            href="#"
            id="footer-inicio"
            class="btn-footer"
        >

            <img
                src="../img/inicio.png"
                class="icono-footer"
                alt="Inicio"
            >

            <p>
                Inicio
            </p>


        </a>





        <a
            href="../html/mis-reportes.html"
            class="btn-footer"
        >

            <img
                src="../img/reportes.png"
                class="icono-footer"
                alt="Reportes"
            >
            <p>
                Reportes
            </p>


        </a>





        <a
            href="../html/perfil.html"
            class="btn-footer"
        >

            <img
                src="../img/usuario.png"
                class="icono-footer"
                alt="Perfil"
            >


            <p>
                Perfil
            </p>


        </a>



    </footer>






    <!-- JAVASCRIPT -->


    <script src="../js/btn-activo.js"></script>

    <script src="../js/perfil.js"></script>

    <script src="../js/footer.js"></script>



</body>

</html>
