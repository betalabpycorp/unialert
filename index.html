<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <main>
        <div class="contenedor-logo">
            <img src="img/logo.png" class="logo" alt="">
            <h1>Uni<span class="span-rojo">Alert</span></h1>
        </div>
        <div class="frase-1">
            <p>Reporta &bull; Gestiona &bull; Soluciona </p>
        </div>
        <div class="frase-2">
            <h3>
                Aulas en funcionamiento, <br>
                una mejor universidad.
            </h3>
            <h5>
                Reporta problemas en las aulas <br> y permite que el técnico los gestione <br>
                de forma rápida y eficiente.
            </h5>
        </div>

        <form id="login-form" class="form-login">
            <div>
                <img src="img/user.png" alt="aqui va el usuario">
                <input type="text" placeholder="Ingrese su usuario" name="txtusuario" id="txtusuario" required minlength="1" maxlength="10">
            </div>
            <div>
                <img src="img/pass.png" alt="aqui va la contraseña">
                <input type="password" name="txtpass" id="txtpass" required placeholder="Contraseña" minlength="8">
            </div>
            <button type="submit">Entrar</button>
            <a href="">¿Olvidaste la contraseña?</a>
        </form>
    </main>

    <footer>
        <p style = "text-align: center; color: #333232;">Desarrollado por Arianna Y Gonzalo</p>
    </footer>




    <script src="js/login.js"></script>
</body>
</html>
